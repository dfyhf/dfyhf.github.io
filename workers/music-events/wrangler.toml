# Must match the Worker name in Cloudflare (dashboard: iterations).
name = "iterations"
main = "src/index.js"
compatibility_date = "2024-04-01"

# KV namespace "iterations" — keep in sync with Workers → iterations → Bindings → MUSIC_LOGS.
# List keys on Cloudflare (Wrangler 4 defaults to local unless --remote):
#   npx wrangler kv key list --namespace-id=e6af61f08e6a47199aad1cf755beecf5 --prefix=event: --remote
[[kv_namespaces]]
binding = "MUSIC_LOGS"
id = "e6af61f08e6a47199aad1cf755beecf5"
