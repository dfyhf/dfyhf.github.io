<!doctype html>
<!--
  Local mobile preview for iterations.band — loads index.html in a sized iframe.

  From the repo root (dfyhf.github.io):
    python3 -m http.server 8765
  Then open:
    http://localhost:8765/mobile-preview.html

  Do not open via file:// — index.html uses absolute paths like /script.js.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile preview — iterations</title>
    <style>
      :root {
        --bg: #1a1a1c;
        --panel: #252528;
        --text: #e8e6e3;
        --muted: #8a8680;
        --accent: #c9a87c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        font-size: 14px;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        padding: 12px 16px;
        background: var(--panel);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      .toolbar h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--accent);
        letter-spacing: 0.02em;
      }
      .toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .toolbar input[type="range"] {
        width: 160px;
        vertical-align: middle;
      }
      .toolbar select,
      .toolbar button {
        font: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(0, 0, 0, 0.35);
        color: var(--text);
        cursor: pointer;
      }
      .toolbar button:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .toolbar .hint {
        flex: 1 1 200px;
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.4;
      }
      .toolbar code {
        font-size: 0.78rem;
        background: rgba(0, 0, 0, 0.45);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .stage {
        flex: 1 1 auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px 16px 32px;
        overflow: auto;
      }
      .frame {
        flex: 0 0 auto;
        width: var(--frame-w, 390px);
        max-width: 100%;
        border-radius: 28px;
        border: 3px solid #3a3a3e;
        box-shadow:
          0 24px 64px rgba(0, 0, 0, 0.55),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        overflow: hidden;
        background: #000;
      }
      .frame iframe {
        display: block;
        width: 100%;
        height: min(844px, calc(100vh - 140px));
        border: 0;
        background: #fff;
      }
      .width-readout {
        font-variant-numeric: tabular-nums;
        min-width: 3.5rem;
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <h1>Mobile preview</h1>
      <label>
        <span class="width-readout" id="w-out">390</span>px
        <input
          id="w-range"
          type="range"
          min="320"
          max="520"
          value="390"
          step="1"
        />
      </label>
      <label>
        Preset
        <select id="preset" aria-label="Viewport width preset">
          <option value="360">360 — small Android</option>
          <option value="390" selected>390 — iPhone portrait</option>
          <option value="393">393 — Pixel</option>
          <option value="428">428 — iPhone Plus / Max</option>
          <option value="440">440 — shell container breakpoint</option>
          <option value="520">520 — CSS fallback breakpoint</option>
        </select>
      </label>
      <button type="button" id="reload" title="Reload preview">Reload</button>
      <p class="hint">
        Run from repo root:
        <code>python3 -m http.server 8765</code>
        then open
        <code>/mobile-preview.html</code>
        — not <code>file://</code> (site uses absolute <code>/script.js</code> paths).
      </p>
    </header>
    <div class="stage">
      <div class="frame" id="frame" style="--frame-w: 390px">
        <iframe id="preview" src="index.html" title="iterations.band preview"></iframe>
      </div>
    </div>
    <script>
      (function () {
        const frame = document.getElementById("frame");
        const iframe = document.getElementById("preview");
        const range = document.getElementById("w-range");
        const out = document.getElementById("w-out");
        const preset = document.getElementById("preset");
        const reload = document.getElementById("reload");

        function setWidth(px) {
          const w = Math.max(320, Math.min(520, Number(px) || 390));
          frame.style.setProperty("--frame-w", w + "px");
          range.value = String(w);
          out.textContent = String(w);
          const opt = preset.querySelector(`option[value="${w}"]`);
          if (opt) preset.value = String(w);
        }

        range.addEventListener("input", function () {
          setWidth(range.value);
        });

        preset.addEventListener("change", function () {
          if (preset.value) setWidth(preset.value);
        });

        reload.addEventListener("click", function () {
          iframe.src = iframe.src;
        });

        setWidth(390);
      })();
    </script>
  </body>
</html>
